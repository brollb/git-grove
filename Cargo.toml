[package]
name = "git-worktrees"
version = "0.1.0"
edition = "2021"
description = "List git worktrees, annotated with open GitHub PR numbers"

[[bin]]
name = "git-worktrees"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty", "libc"] }
serde_json = "1"

[profile.release]
opt-level = 2
strip = true
