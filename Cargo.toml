[package]
name = "grove"
version = "0.1.0"
edition = "2021"
description = "Browse, search and prune the git worktrees of a repo"

[[bin]]
name = "grove"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty", "libc"] }
serde_json = "1"

[profile.release]
opt-level = 2
strip = true
